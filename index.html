<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baralho DISC</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --texto: #210000;
  --fundo: #f5f7fa;
  --azul-escuro: #001B71;
  --azul: #007BEA;
  /* cor de destaque do perfil ativo (escura, media, clara) */
  --p-escura: #62003B;
  --p-media: #E6233A;
  --p-clara: #F9CBD2;
}

body {
  font-family: 'Aptos', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--fundo);
  color: var(--texto);
  min-height: 100vh;
  padding: 24px 16px;
}

h1, h2, h3, .titulo {
  font-family: 'Raleway', 'Segoe UI', sans-serif;
  font-weight: 700;
  color: var(--texto);
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 24px;
  border-bottom: 1px solid #e6eaf0;
}
.header .logo img { height: 30px; display: block; }
.header .tag {
  font-family: 'Raleway', sans-serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--azul-escuro);
  background: #B3DFFF;
  border-radius: 12px;
  padding: 6px 12px;
}

.intro { padding: 28px 24px 8px; }
.intro h1 { font-size: 30px; line-height: 1.15; }
.intro p { margin-top: 8px; font-size: 16px; line-height: 1.5; max-width: 640px; }

/* Seletor de perfil */
.perfis {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 20px 24px 8px;
}
.perfil-btn {
  font-family: 'Raleway', sans-serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--texto);
  background: #fff;
  border: 2px solid #d9dee6;
  border-radius: 12px;
  padding: 14px 8px;
  cursor: pointer;
  transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.perfil-btn .bolinha {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--c-media);
  flex: none;
}
.perfil-btn:hover { border-color: var(--c-media); background: var(--c-clara); }
.perfil-btn[aria-selected="true"] {
  background: var(--c-escura);
  border-color: var(--c-escura);
  color: #fff;
}
.perfil-btn[aria-selected="true"] .bolinha { background: var(--c-clara); }
.perfil-btn:focus-visible, .acao:focus-visible, .carta:focus-visible {
  outline: 3px solid var(--azul);
  outline-offset: 3px;
}

/* Barra de ações */
.barra {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 16px 24px 8px;
}
.barra h2 { font-size: 22px; color: var(--p-escura); }
.acao {
  font-family: 'Raleway', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: #fff;
  background: var(--azul);
  border: none;
  border-radius: 8px;
  padding: 11px 20px;
  cursor: pointer;
  transition: background 0.3s ease;
}
.acao:hover { background: #0063c5; }

/* Cartas */
.grade {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  padding: 16px 24px 32px;
}
.carta {
  background: none;
  border: none;
  padding: 0;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
  perspective: 1200px;
  display: block;
  width: 100%;
  height: 100%;
}
.carta-interna {
  display: grid;
  transition: transform 0.6s ease;
  transform-style: preserve-3d;
  min-height: 260px;
  height: 100%;
}
.carta[aria-pressed="true"] .carta-interna { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 12px;
  padding: 22px;
  display: flex;
  flex-direction: column;
}
.frente {
  background: var(--p-escura);
  color: #fff;
  justify-content: space-between;
  border-bottom: 8px solid var(--p-media);
}
.frente .perfil-nome {
  font-family: 'Raleway', sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--p-clara);
}
.frente .letra {
  font-family: 'Raleway', sans-serif;
  font-weight: 700;
  font-size: 96px;
  line-height: 1;
  color: var(--p-clara);
  opacity: 0.9;
}
.frente .categoria {
  font-family: 'Raleway', sans-serif;
  font-weight: 700;
  font-size: 24px;
  line-height: 1.15;
  color: #fff;
}
.frente .dica { font-size: 13px; color: var(--p-clara); margin-top: 8px; }

.verso {
  background: var(--p-clara);
  color: var(--texto);
  transform: rotateY(180deg);
  border-top: 8px solid var(--p-media);
}
.verso .cat {
  font-family: 'Raleway', sans-serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--p-escura);
  margin-bottom: 12px;
}
.verso ul { list-style: none; display: grid; gap: 9px; }
.verso li {
  position: relative;
  padding-left: 20px;
  font-size: 15.5px;
  line-height: 1.4;
}
.verso li::before {
  content: "";
  position: absolute;
  left: 0; top: 7px;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--p-escura);
}

.rodape {
  padding: 16px 24px 24px;
  font-size: 13px;
  border-top: 1px solid #e6eaf0;
}

@media (max-width: 900px) {
  .grade { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  body { padding: 16px 12px; }
  .header, .intro, .barra { padding-left: 16px; padding-right: 16px; }
  .perfis { padding-left: 16px; padding-right: 16px; gap: 8px; }
  .perfil-btn { font-size: 15px; padding: 12px 4px; gap: 6px; flex-direction: column; }
  .grade { grid-template-columns: 1fr; padding: 12px 16px 24px; }
  .intro h1 { font-size: 24px; }
  .carta-interna { min-height: 220px; }
  .frente .letra { font-size: 72px; }
  .frente .categoria { font-size: 21px; }
  .header .tag { display: none; }
  .barra h2 { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  .carta-interna { transition: none; }
}
</style>
</head>

  <section class="intro">
    <h1>Baralho DISC</h1>
    <p>Escolha um perfil e clique nas cartas para virar. Cada perfil tem cinco cartas: características, como delegar, como dar feedback, como negociar e como desenvolver.</p>
  </section>

  <nav class="perfis" role="tablist" aria-label="Perfis DISC" id="perfis"></nav>

  <div class="barra">
    <h2 id="tituloPerfil"></h2>
    <button class="acao" id="virarTodas" type="button">Virar todas as cartas</button>
  </div>

  <main class="grade" id="grade" role="tabpanel" aria-live="polite"></main>

  <footer class="rodape">Clique ou use Enter/Espaço em uma carta para virá-la.</footer>
</div>

<script>
const PERFIS = {
  D: {
    nome: "Alto D",
    cores: { escura: "#62003B", media: "#E6233A", clara: "#F9CBD2" },
    cartas: [
      { categoria: "Características", itens: [
        "Rápidas, impacientes e objetivas",
        "Competitivas, orientadas para superação de metas",
        "Corajosas, tomam decisões rápidas",
        "Necessidade de agir com rapidez",
        "Desafiam a si mesmas e às outras pessoas" ] },
      { categoria: "Como delegar", itens: [
        "Determinar o objetivo e os resultados esperados",
        "Dar autonomia",
        "Meta desafiadora",
        "Cobrar resultados",
        "Ver se está atropelando pessoas" ] },
      { categoria: "Como dar feedback", itens: [
        "Ter objetividade, indo ao ponto rapidamente.",
        "Focar em resultados, mostrando como o feedback impacta os objetivos.",
        "Oferecer soluções práticas, evitando críticas sem direcionamento.",
        "Reconhecer conquistas de forma rápida e eficaz." ] },
      { categoria: "Como negociar", itens: [
        "Apresentar opções ou alternativas para mostrar flexibilidade.",
        "Manter o foco no objetivo final, destacando os benefícios.",
        "Manter a postura firme e confiante, sem hesitar." ] },
      { categoria: "Como desenvolver", itens: [
        "Dar autonomia",
        "Delegar muito / desafiar",
        "Empoderar quando possível",
        "Não exercer excesso de cobrança",
        "Deixar claro os ganhos para o desenvolvimento" ] }
    ]
  },
  I: {
    nome: "Alto I",
    cores: { escura: "#876300", media: "#FFB93E", clara: "#FFF0C6" },
    cartas: [
      { categoria: "Características", itens: [
        "Comunicativas, influentes e sociáveis",
        "Inspiradoras, motivam as pessoas",
        "Irradiam otimismo",
        "Confiantes",
        "Procuram interagir e verbalizar intensamente",
        "Causam boa impressão" ] },
      { categoria: "Como delegar", itens: [
        "Mostrar benefícios para o grupo",
        "Mais pontos de controle",
        "Ser otimista, entusiasta",
        "Fazer de maneira informal, pessoalizada" ] },
      { categoria: "Como dar feedback", itens: [
        "Impacto nas pessoas",
        "Em contexto descontraído (almoço, por exemplo)",
        "Negativo em privacidade e positivo, em público",
        "Usar abordagem informal" ] },
      { categoria: "Como negociar", itens: [
        "Mostrar disponibilidade para conversar",
        "Buscar afinidades com a pessoa",
        "Trazer reconhecimentos",
        "Começar com quebragelo" ] },
      { categoria: "Como desenvolver", itens: [
        "Investir no relacionamento",
        "Ter presença nos momentos em conjunto",
        "Oferecer sua disponibilidade e atenção",
        "Conversar sempre que possível",
        "Reconhecer frequentemente",
        "Fazer follow-up" ] }
    ]
  },
  S: {
    nome: "Alto S",
    cores: { escura: "#003E00", media: "#00C466", clara: "#BDF4CC" },
    cartas: [
      { categoria: "Características", itens: [
        "Possuem uma forma definida de realizar tarefas",
        "Trabalham em equipe, com disposição a servir",
        "Querem sempre terminar o que começam",
        "Levam estabilidade e previsibilidade para o ambiente de trabalho",
        "Cultivam relacionamentos" ] },
      { categoria: "Como delegar", itens: [
        "Pontuar melhor os prazos",
        "Oferecer bastante informação com antecedência",
        "Se mostrar disponível",
        "Delegar uma tarefa de cada vez",
        "Tarefas que exijam paciência e persistência",
        "Não botar muita pressão" ] },
      { categoria: "Como dar feedback", itens: [
        "Ser gentil e evitar palavras agressivas",
        "Criar um ambiente seguro, em local privado.",
        "Validar esforços antes de sugerir melhorias.",
        "Trazer especificidades, com exemplos claros",
        "Mostrar apoio, oferecendo ajuda" ] },
      { categoria: "Como negociar", itens: [
        "Demonstrar conhecimento, seguranças, referências na sua argumentação",
        "Não utilizar pressão ou persuasão muito direta" ] },
      { categoria: "Como desenvolver", itens: [
        "Ter cautela ao comunicar mudanças",
        "Demonstrar atenção frequentemente",
        "Reconhecer sempre que possível",
        "Encorajar que a pessoa auxilie colegas" ] }
    ]
  },
  C: {
    nome: "Alto C",
    cores: { escura: "#001B71", media: "#007BEA", clara: "#B3DFFF" },
    cartas: [
      { categoria: "Características", itens: [
        "Foco na perfeição em tudo o que faz",
        "Detalhista e minuciosa",
        "Necessidade de procedimentos bem definidos",
        "Mente analítica",
        "Buscam informações para tomarem decisões",
        "Conformidade com a política definida" ] },
      { categoria: "Como delegar", itens: [
        "Planejar o que e como delegar, com detalhes",
        "Trazer objetivos claros",
        "Fazer alinhamento detalhado e informar as regras da tarefa",
        "Dar atividades envolvendo lógica e embasamento" ] },
      { categoria: "Como dar feedback", itens: [
        "Oferecer feedback estruturado",
        "Programar reuniões de feedback",
        "Feedback lógico e bem embasado",
        "Utilizar abordagem formal",
        "Marcar hora e formalizar após" ] },
      { categoria: "Como negociar", itens: [
        "Ter precisão e organização, evitando imprecisões ou falhas",
        "Mostrar como a proposta atende aos critérios de qualidade e eficiência",
        "Ser paciente e dar tempo para a pessoa analisar as opções",
        "Demonstrar confiança nas soluções apresentadas, sem pressa" ] },
      { categoria: "Como desenvolver", itens: [
        "Estimular o pensamento analítico com desafios.",
        "Proporcionar oportunidades de aprendizado técnico.",
        "Dar espaço para organizar ideias antes de decidir.",
        "Oferecer feedback focado em melhorias.",
        "Reconhecer a precisão e o cuidado nas tarefas." ] }
    ]
  }
};

const ORDEM = ["D", "I", "S", "C"];
let ativo = "D";

const elPerfis = document.getElementById("perfis");
const elGrade = document.getElementById("grade");
const elTitulo = document.getElementById("tituloPerfil");
const elVirar = document.getElementById("virarTodas");

function aplicarCores(c) {
  const r = document.documentElement.style;
  r.setProperty("--p-escura", c.escura);
  r.setProperty("--p-media", c.media);
  r.setProperty("--p-clara", c.clara);
}

function montarSeletor() {
  ORDEM.forEach(function (k) {
    const p = PERFIS[k];
    const b = document.createElement("button");
    b.type = "button";
    b.className = "perfil-btn";
    b.setAttribute("role", "tab");
    b.dataset.perfil = k;
    b.style.setProperty("--c-escura", p.cores.escura);
    b.style.setProperty("--c-media", p.cores.media);
    b.style.setProperty("--c-clara", p.cores.clara);
    b.innerHTML = '<span class="bolinha" aria-hidden="true"></span><span>' + p.nome + "</span>";
    b.addEventListener("click", function () { selecionar(k); });
    elPerfis.appendChild(b);
  });
}

function montarCartas() {
  const p = PERFIS[ativo];
  elGrade.innerHTML = "";
  p.cartas.forEach(function (c) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "carta";
    btn.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-label", p.nome + ": " + c.categoria + ". Clique para virar a carta.");

    const itens = c.itens.map(function (t) { return "<li>" + t + "</li>"; }).join("");
    btn.innerHTML =
      '<div class="carta-interna">' +
        '<div class="face frente">' +
          '<div>' +
            '<div class="perfil-nome">Alto</div>' +
            '<div class="letra" aria-hidden="true">' + ativo + "</div>" +
          "</div>" +
          "<div>" +
            '<div class="categoria">' + c.categoria + "</div>" +
            '<div class="dica">Clique para virar</div>' +
          "</div>" +
        "</div>" +
        '<div class="face verso">' +
          '<div class="cat">' + c.categoria + "</div>" +
          "<ul>" + itens + "</ul>" +
        "</div>" +
      "</div>";
    btn.addEventListener("click", function () {
      const on = btn.getAttribute("aria-pressed") === "true";
      btn.setAttribute("aria-pressed", on ? "false" : "true");
      atualizarBotaoVirar();
    });
    elGrade.appendChild(btn);
  });
  atualizarBotaoVirar();
}

function atualizarBotaoVirar() {
  const cartas = elGrade.querySelectorAll(".carta");
  const todas = Array.prototype.every.call(cartas, function (c) {
    return c.getAttribute("aria-pressed") === "true";
  });
  elVirar.textContent = todas ? "Desvirar todas as cartas" : "Virar todas as cartas";
}

elVirar.addEventListener("click", function () {
  const cartas = elGrade.querySelectorAll(".carta");
  const todas = Array.prototype.every.call(cartas, function (c) {
    return c.getAttribute("aria-pressed") === "true";
  });
  cartas.forEach(function (c) { c.setAttribute("aria-pressed", todas ? "false" : "true"); });
  atualizarBotaoVirar();
});

function selecionar(k) {
  ativo = k;
  aplicarCores(PERFIS[k].cores);
  elTitulo.textContent = "Perfil " + PERFIS[k].nome;
  elPerfis.querySelectorAll(".perfil-btn").forEach(function (b) {
    b.setAttribute("aria-selected", b.dataset.perfil === k ? "true" : "false");
  });
  montarCartas();
}

montarSeletor();
selecionar("D");
</script>
